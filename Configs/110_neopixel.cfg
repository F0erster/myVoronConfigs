#####################################################################
#  Status LED macros - logo shows the status, nozzle the matching colour
#  Order = sequence of a print
#####################################################################

[gcode_macro _STATUS_SET]
description: Helper - set logo and nozzle effect (LOGO, NOZZLE)
gcode:
    SET_LED_EFFECT EFFECT={params.LOGO} REPLACE=1
    SET_LED_EFFECT EFFECT={params.NOZZLE|default('status_nozzle_off')} REPLACE=1

[gcode_macro _STATUS_IDLE]
description: Back to ready, but only when no print is running or paused
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        _STATUS_READY
    {% endif %}

[gcode_macro _STATUS_READY]
gcode: _STATUS_SET LOGO=status_logo_ready NOZZLE=status_nozzle_off

[gcode_macro _STATUS_HOMING]
gcode: _STATUS_SET LOGO=status_logo_homing NOZZLE=status_nozzle_cyan

[gcode_macro _STATUS_HEATING]
gcode: _STATUS_SET LOGO=status_logo_heating NOZZLE=status_nozzle_orange

[gcode_macro _STATUS_LEVELING]
gcode: _STATUS_SET LOGO=status_logo_leveling NOZZLE=status_nozzle_magenta

[gcode_macro _STATUS_CALIBRATING_Z]
gcode: _STATUS_SET LOGO=status_logo_calibrating_z NOZZLE=status_nozzle_blue

[gcode_macro _STATUS_MESHING]
gcode: _STATUS_SET LOGO=status_logo_meshing NOZZLE=status_nozzle_green

[gcode_macro _STATUS_CLEANING]
gcode: _STATUS_SET LOGO=status_logo_cleaning NOZZLE=status_nozzle_white

[gcode_macro _STATUS_PRINTING]
gcode: _STATUS_SET LOGO=status_logo_printing NOZZLE=status_nozzle_white

[gcode_macro _STATUS_PAUSED]
gcode: _STATUS_SET LOGO=status_logo_paused NOZZLE=status_nozzle_white

[gcode_macro _STATUS_PART_READY]
gcode: _STATUS_SET LOGO=status_logo_part_ready NOZZLE=status_nozzle_off

[gcode_macro STATUS_OFF]
description: All toolhead LEDs off
gcode: STOP_LED_EFFECTS

[gcode_macro RAINBOW]
description: Rainbow for fun - next status call ends it
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow