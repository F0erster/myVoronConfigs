# =====================================================================
# M600 filament change during a print, with button menu
#
# STEP 1 - Configs/101_macros.cfg: delete the old M600 block
#          ([gcode_macro M600] with its "PAUSE X=150 ..." line and comment).
# STEP 2 - Append everything below the line to the END of
#          Configs/103_load_unload_filament.cfg, then restart Klipper.
#
# PAUSE and RESUME stay untouched. They are used as they are:
#   PAUSE  saves the position, retracts, lifts and parks.
#   RESUME unretracts and moves back to the saved position.
# Visible macros: M600 and PAUSE_MENU. All others start with "_".
# =====================================================================


[gcode_macro _M600_CONFIG]
description: Settings of the M600 filament menu (does nothing)
variable_park_x: 148                  # front centre: pause position and Front button
variable_park_y: 10
variable_back_x: 148                  # back centre: Back button
variable_back_y: 290
variable_lift: 15                     # mm above the layer while paused (Z is never lowered)
variable_fan_speed: 0.35              # part fan while paused, -1 = leave unchanged
variable_purge_speed: 0               # mm/min for purging, 0 = wizard default, e.g. 100 for flex
variable_extra_retract: 0.0           # mm, extra retract before resuming (tune if a blob shows at the restart point)
gcode:
    # Settings only.


[gcode_macro _M600_STATE]
description: Internal state of the M600 menu (does nothing)
variable_active: 0
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
variable_temp: 0.0
variable_fan: 0.0
gcode:
    # State storage only.


# ---------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------

[gcode_macro M600]
description: Filament change. During a print: pause and open the menu. Idle: start the wizard.
gcode:
    {% set cfg = printer["gcode_macro _M600_CONFIG"] %}
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% if printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=x VALUE={pos.x|float}
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=y VALUE={pos.y|float}
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=z VALUE={pos.z|float}
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=temp VALUE={printer.extruder.target|float}
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=purge_speed VALUE={cfg.purge_speed|float}
        {% if printer.fan is defined %}
            SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=fan VALUE={printer.fan.speed|float}
            {% if cfg.fan_speed|float >= 0 %}
                M106 S{(cfg.fan_speed|float * 255)|round|int}
            {% endif %}
        {% endif %}
        PAUSE X={cfg.park_x} Y={cfg.park_y} Z_MIN={[pos.z|float + cfg.lift|float, zmax]|min}
        _M600_GOTO
        _M600_MENU
    {% elif printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_MENU
    {% else %}
        CHANGE_FILAMENT
    {% endif %}


[gcode_macro PAUSE_MENU]
description: Reopen the filament change menu while paused by M600
gcode:
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is only available during an M600 pause."
    {% endif %}


# ---------------------------------------------------------------------
# Prompts
# ---------------------------------------------------------------------

[gcode_macro _M600_BUSY]
description: Prompt without answers (TITLE, TEXT)
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Please wait')}"
    RESPOND TYPE=command MSG="action:prompt_text {params.TEXT|default('Working.')}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_FILAMENT_CHANGE_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _M600_MENU]
description: Show the filament change menu
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament change"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle is hot. 1: Unload, pull old filament out. 2: Insert new filament, press Load. 3: Purge until colour is clean."
    RESPOND TYPE=command MSG="action:prompt_text Toolhead Movement"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Unload|_M600_UNLOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_button Load|_M600_LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Purge|_M600_PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Move to Back|_M600_BACK|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Move to Front|_M600_FRONT|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|_M600_CANCEL_ASK|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue print|_M600_CONTINUE_ASK|primary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _M600_CONTINUE_ASK]
description: Ask before the print continues
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Continue print?"
    RESPOND TYPE=command MSG="action:prompt_text Is the new filament coming out in the right colour, and are purge blob and string removed from bed and nozzle?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes - continue print|_M600_CONTINUE|primary"
    RESPOND TYPE=command MSG="action:prompt_button No - back|_M600_MENU|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _M600_CANCEL_ASK]
description: Ask before the print is cancelled
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Cancel print?"
    RESPOND TYPE=command MSG="action:prompt_text This stops and cancels the whole print. Are you sure?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes - cancel print|_M600_CANCEL_DO|error"
    RESPOND TYPE=command MSG="action:prompt_button No - back|_M600_MENU|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _M600_LOST]
description: Printer lost its position during the pause
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Print cannot continue"
    RESPOND TYPE=command MSG="action:prompt_text The printer lost its position during the long pause. The print cannot be resumed safely. Please cancel the print."
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|_M600_CANCEL_DO|error"
    RESPOND TYPE=command MSG="action:prompt_show"


# ---------------------------------------------------------------------
# Actions behind the buttons
# ---------------------------------------------------------------------

[gcode_macro _M600_HEAT]
description: Make sure the nozzle is at the print temperature saved at pause
gcode:
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% set t = st.temp|float %}
    {% if t > 0 %}
        {% if printer.extruder.target|float != t %}
            M104 S{t}
        {% endif %}
        {% if printer.extruder.temperature|float < t - 3 %}
            _M600_BUSY TITLE="Heating" TEXT="Heating nozzle to {t|int} C. Please wait..."
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - 3}
        {% endif %}
    {% endif %}


[gcode_macro _M600_GOTO]
description: Move to X/Y at pause height or higher, never lower (X, Y)
gcode:
    {% set cfg = printer["gcode_macro _M600_CONFIG"] %}
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
    {% set tool = printer.toolhead %}
    {% set x = params.X|default(cfg.park_x)|float %}
    {% set y = params.Y|default(cfg.park_y)|float %}
    {% set x = [[x, tool.axis_minimum.x|float]|max, tool.axis_maximum.x|float]|min %}
    {% set y = [[y, tool.axis_minimum.y|float]|max, tool.axis_maximum.y|float]|min %}
    {% set z_safe = [st.z|float + cfg.lift|float, tool.axis_maximum.z|float]|min %}
    {% set z_now = printer.gcode_move.gcode_position.z|float %}
    {% set sp_hop = client.speed_hop|default(15)|float * 60 %}
    {% set sp_move = client.speed_move|default(200)|float * 60 %}
    SAVE_GCODE_STATE NAME=_m600_goto
    G90
    {% if z_now < z_safe %}
        G1 Z{z_safe} F{sp_hop}
    {% endif %}
    G1 X{x} Y{y} F{sp_move}
    RESTORE_GCODE_STATE NAME=_m600_goto


[gcode_macro _M600_UNLOAD]
description: Unload the filament (button)
gcode:
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_HEAT
        _M600_BUSY TITLE="Unloading" TEXT="Unloading filament..."
        _FILAMENT_UNLOAD
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% endif %}


[gcode_macro _M600_LOAD]
description: Load the filament and purge (button)
gcode:
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_HEAT
        _M600_BUSY TITLE="Loading" TEXT="Loading new filament and purging..."
        _FILAMENT_LOAD
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% endif %}


[gcode_macro _M600_PURGE]
description: Purge more filament (button)
gcode:
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_HEAT
        _M600_BUSY TITLE="Purging" TEXT="Purging more filament..."
        _FILAMENT_PURGE
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% endif %}


[gcode_macro _M600_BACK]
description: Move the toolhead to the back centre (button)
gcode:
    {% set cfg = printer["gcode_macro _M600_CONFIG"] %}
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_GOTO X={cfg.back_x} Y={cfg.back_y}
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% endif %}


[gcode_macro _M600_FRONT]
description: Move the toolhead to the front centre (button)
gcode:
    {% set cfg = printer["gcode_macro _M600_CONFIG"] %}
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% if printer.pause_resume.is_paused and st.active|int == 1 %}
        _M600_GOTO X={cfg.park_x} Y={cfg.park_y}
        _M600_MENU
    {% else %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% endif %}


[gcode_macro _M600_CONTINUE]
description: Heat, restore fan, balance retract, return above the print, RESUME
gcode:
    {% set cfg = printer["gcode_macro _M600_CONFIG"] %}
    {% set st = printer["gcode_macro _M600_STATE"] %}
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
    {% set retract = client.unretract|default(1.0)|float + cfg.extra_retract|float %}
    {% set sp_retract = client.speed_retract|default(35)|float * 60 %}
    {% if not (printer.pause_resume.is_paused and st.active|int == 1) %}
        RESPOND TYPE=error MSG="The filament menu is not active."
    {% elif 'xyz' not in printer.toolhead.homed_axes %}
        _M600_LOST
    {% else %}
        _M600_HEAT
        _M600_BUSY TITLE="Resuming print" TEXT="Preparing to continue the print..."
        SAVE_GCODE_STATE NAME=_m600_resume
        M83
        G1 E-{retract} F{sp_retract}
        RESTORE_GCODE_STATE NAME=_m600_resume
        {% if printer.fan is defined and cfg.fan_speed|float >= 0 %}
            M106 S{(st.fan|float * 255)|round|int}
        {% endif %}
        _M600_GOTO X={st.x} Y={st.y}
        M400
        SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=active VALUE=0
        _FILAMENT_CHANGE_CLOSE
        RESUME
    {% endif %}


[gcode_macro _M600_CANCEL_DO]
description: Cancel the print
gcode:
    SET_GCODE_VARIABLE MACRO=_M600_STATE VARIABLE=active VALUE=0
    _FILAMENT_CHANGE_CLOSE
    CANCEL_PRINT