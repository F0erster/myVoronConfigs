#####################################################################
#  LED Control 
#####################################################################

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW, GRBW, GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.5

[output_pin caselight]
## Chamber Lighting - CNC_FAN5
pin: PD15
pwm:true
#shutdown_value: 0
#value:0
cycle_time: 0.01

[gcode_macro _CASELIGHT_ON]
description: Helper: Light on
gcode:
  SET_PIN PIN=caselight VALUE={0.40}
  {action_respond_info("Caselight on")}
    
[gcode_macro _CASELIGHT_OFF]
description: Helper: Light off
gcode:
  SET_PIN PIN=caselight VALUE=0.0
  {action_respond_info("Caselight off")}

[gcode_macro CASELIGHT]
description: Toggle light
gcode: 
      {% if printer['output_pin caselight'].value == 0 %} _CASELIGHT_ON {% else %} _CASELIGHT_OFF {% endif %}

[gcode_shell_command caselight_night]
command: /usr/bin/bash /home/F0erster/printer_data/config/scripts/caselight_night.sh
timeout: 5
verbose: False

[delayed_gcode _CASELIGHT_STARTUP]
initial_duration: 3          # runs once after every Klipper start / FIRMWARE_RESTART
gcode:
    RUN_SHELL_COMMAND CMD=caselight_night



