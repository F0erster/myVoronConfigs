#############################################################################################################
# LOAD AND UNLOAD FILAMENT
#############################################################################################################
# =====================================================================
# Filament change wizard (prompts in KlipperScreen / Mainsail)
#
# Only ONE macro is visible to the user: CHANGE_FILAMENT.
# Everything else starts with "_" and is hidden in KlipperScreen/Mainsail.
#
#
# Requires: _CG28 (101_macros.cfg), [respond], [pause_resume]
# The wizard is for idle use only. It never touches the bed.
#
# Behaviour in short:
#   - Heats to 140 C immediately and homes/parks while heating. If the
#     printer is unhomed AND the nozzle is hotter than home_max_temp, it
#     waits for the cooldown first (contact homing needs a cool nozzle).
#   - Unload always happens at one blanket temperature (unload_temp).
#   - Load happens at the temperature of the selected material.
#   - Every question appears only after the printer finished its moves.
#   - Without user input for "timeout" seconds the wizard aborts and
#     restores the previous nozzle target (heater off in most cases).
#
# Stages (_FILAMENT_CHANGE_STATE.stage):
#   0 idle
#   1 nozzle too hot to home, waiting for cooldown
#   2 preparing (homing, parking)
#   3 heating to unload_temp
#   4 unload heat soak, then unload
#   5 user: remove old filament
#   6 user: select material
#   7 user: insert filament, heating/cooling to load temperature
#   8 load heat soak, then load + purge
#   9 user: is filament extruding cleanly?
# =====================================================================


# ---------------------------------------------------------------------
# Settings
# ---------------------------------------------------------------------

[gcode_macro _FILAMENT_CHANGE_CONFIG]
description: Settings of the filament change wizard (does nothing)
variable_preheat_temp: 140            # nozzle target while homing and while asking for the material
variable_home_max_temp: 255           # homing only starts when the nozzle is at or below this
variable_unload_temp: 240             # blanket unload temperature for every material
variable_temp_pla: 210
variable_temp_petg: 230
variable_temp_asa: 240                # ASA and ABS
variable_temp_flex: 215
variable_purge_speed_flex: 100        # mm/min, about 1.7 mm/s or 4 mm3/s
variable_tolerance: 2                 # +/- degrees that count as "temperature reached"
variable_soak_seconds: 5              # heat soak before unload and before load
variable_park_x: 147.5
variable_park_y: 10
variable_park_z: 30                   # minimum park height
variable_unload_purge: 10             # mm, same as the old macro
variable_unload_distance: 40          # mm retract after the purge. Must stop BEFORE the tip leaves the gears (tune, see notes)
variable_unload_speed: 1500           # mm/min retract speed (was ~3000)
variable_step_length: 20              # mm per press of the Load / Unload buttons
variable_step_speed: 300              # mm/min for the Load / Unload buttons
variable_load_distance: 60            # mm, same as the old macro
variable_load_purge: 15               # mm, same as the old macro (also used for "purge more")
variable_purge_speed: 300             # mm/min
variable_timeout: 600                 # seconds without user input until the wizard aborts
variable_wizard_idle_timeout: 1800    # idle_timeout while the wizard is active (must be larger than timeout)
gcode:
    # Settings only.


# ---------------------------------------------------------------------
# Wizard state (internal)
# ---------------------------------------------------------------------

[gcode_macro _FILAMENT_CHANGE_STATE]
description: Internal state of the filament change wizard (does nothing)
variable_active: 0
variable_operation: 0       # 1 = complete change, 2 = unload only, 3 = load only
variable_stage: 0
variable_restore_temp: 0.0
variable_load_temp: 0.0
variable_inserted: 0
variable_retries: 0
variable_deadline: 0.0
variable_purge_speed: 0               # purge speed of the selected material, 0 = default
variable_quick_homed: 0			# skip additional z calibrations for fil. change
gcode:
    # State storage only.


# ---------------------------------------------------------------------
# Extrusion helpers (replace the old LOAD_FILAMENT / UNLOAD_FILAMENT)
# ---------------------------------------------------------------------

[gcode_macro _FILAMENT_UNLOAD]
description: Purge a little, then retract the filament out of the hotend
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set fast = printer.configfile.settings['extruder'].max_extrude_only_velocity|float * 40 %}
    SAVE_GCODE_STATE NAME=_fc_unload
    G91
    G92 E0
    G1 E{cfg.unload_purge} F{cfg.purge_speed}
    G1 E-{cfg.unload_distance} F{fast}
    RESTORE_GCODE_STATE NAME=_fc_unload
    M400


[gcode_macro _FILAMENT_PURGE]
description: Extrude the purge distance
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set speed = state.purge_speed|float if state.purge_speed|float > 0 else cfg.purge_speed|float %}
    SAVE_GCODE_STATE NAME=_fc_purge
    G91
    G92 E0
    G1 E{cfg.load_purge} F{speed}
    RESTORE_GCODE_STATE NAME=_fc_purge
    M400


[gcode_macro _FILAMENT_LOAD]
description: Fast-load the filament to the nozzle, then purge
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set fast = printer.configfile.settings['extruder'].max_extrude_only_velocity|float * 6 %}
    SAVE_GCODE_STATE NAME=_fc_load
    G91
    G92 E0
    G1 E{cfg.load_distance} F{fast}
    RESTORE_GCODE_STATE NAME=_fc_load
    _FILAMENT_PURGE


[gcode_macro _FILAMENT_STEP]
description: Manual Extruder Filament stepping. DIR=1 forward, DIR=-1 back. LENGTH and SPEED optional.
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set dir = params.DIR|default(1)|int %}
    {% set length = params.LENGTH|default(cfg.step_length)|float %}
    {% set speed = params.SPEED|default(cfg.step_speed)|float %}
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="Not possible while printing."
    {% elif not printer.extruder.can_extrude %}
        RESPOND TYPE=error MSG="Nozzle too cold ({printer.extruder.temperature|int} C). Heat the nozzle first."
    {% else %}
        SAVE_GCODE_STATE NAME=_fc_step
        M83
        G1 E{dir * length} F{speed}
        RESTORE_GCODE_STATE NAME=_fc_step
        M400
    {% endif %}


[gcode_macro LOAD_FILAMENT]
description: Feed filament forward by one defined step at the current nozzle temperature
gcode:
    _FILAMENT_STEP DIR=1 {rawparams}
 
 
[gcode_macro UNLOAD_FILAMENT]
description: Pull filament back by one defined step at the current nozzle temperature
gcode:
    _FILAMENT_STEP DIR=-1 {rawparams}
 

# ---------------------------------------------------------------------
# Small helpers
# ---------------------------------------------------------------------

[gcode_macro _FILAMENT_CHANGE_TOUCH]
description: Restart the inactivity timer of the wizard
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=deadline VALUE={printer.toolhead.estimated_print_time|float + cfg.timeout|float}


[gcode_macro _FILAMENT_CHANGE_PARK]
description: Lift Z and move the toolhead to the front
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set z = [printer.toolhead.position.z|float, cfg.park_z|float]|max %}
    SAVE_GCODE_STATE NAME=_fc_park
    G90
    G1 Z{z} F1200
    G1 X{cfg.park_x} Y{cfg.park_y} F9000
    RESTORE_GCODE_STATE NAME=_fc_park


[gcode_macro _FILAMENT_CHANGE_CLOSE]
description: Close the prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _FILAMENT_CHANGE_BUSY]
description: Prompt without answers, only Cancel (TITLE, TEXT)
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Please wait')}"
    RESPOND TYPE=command MSG="action:prompt_text {params.TEXT|default('Working.')}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FILAMENT_CHANGE_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_CHANGE_NOTICE]
description: Final message with a Close button (MESSAGE)
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament change"
    RESPOND TYPE=command MSG="action:prompt_text {params.MESSAGE|default('Done.')}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_FILAMENT_CHANGE_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"


# ---------------------------------------------------------------------
# Entry point (the only visible macro)
# ---------------------------------------------------------------------

[gcode_macro CHANGE_FILAMENT]
description: Interactive filament change (unload, load or both)
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament change in progress"
        RESPOND TYPE=command MSG="action:prompt_text Filament change is already in progress. Cancel it to start over."
        RESPOND TYPE=command MSG="action:prompt_button Cancel filament change|_FILAMENT_CHANGE_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|_FILAMENT_CHANGE_CLOSE|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Change filament"
        RESPOND TYPE=command MSG="action:prompt_text Choose loading options. Printer must be idle."
        RESPOND TYPE=command MSG="action:prompt_button Unload + Load|_FILAMENT_CHANGE_START OPERATION=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button Unload only|_FILAMENT_CHANGE_START OPERATION=2|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Load only|_FILAMENT_CHANGE_START OPERATION=3|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|_FILAMENT_CHANGE_CLOSE|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_START]
description: Start the selected operation (OPERATION=1/2/3)
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set operation = params.OPERATION|default(1)|int %}
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set temp = printer.extruder.temperature|float %}
    {% set too_hot = temp > cfg.home_max_temp|float %}
    {% if state.active|int == 1 %}
        # Double tap on the button: ignore.
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        _FILAMENT_CHANGE_NOTICE MESSAGE="The filament wizard cannot be used while a print is running or paused."
    {% elif operation not in [1, 2, 3] %}
        _FILAMENT_CHANGE_NOTICE MESSAGE="Invalid filament change operation."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=operation VALUE={operation}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=restore_temp VALUE={printer.extruder.target|float}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=load_temp VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=inserted VALUE=0
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=retries VALUE=0
        {% if not homed and too_hot %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=1
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=2
        {% endif %}
        _FILAMENT_CHANGE_TOUCH
        SET_IDLE_TIMEOUT TIMEOUT={cfg.wizard_idle_timeout}
        # Start the watchdog first, so it also covers a failed homing.
        UPDATE_DELAYED_GCODE ID=_FILAMENT_CHANGE_POLL DURATION=1
        {% if not homed and too_hot %}
            M104 S{cfg.preheat_temp}
            _FILAMENT_CHANGE_BUSY TITLE="Cooling down" TEXT="Nozzle too hot to home printer. Waiting until below {cfg.home_max_temp|int} C. Please wait."
        {% else %}
            _FILAMENT_CHANGE_PREPARE
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------
# Steps (every step re-checks the stage when it runs)
# ---------------------------------------------------------------------


[gcode_macro _FILAMENT_CHANGE_HOME]
description: Quick homing for the filament wizard (no bed contact, no Z calibration)
gcode:
    _STATUS_HOMING
    G28 X Y
    G28 Z METHOD=PROXIMITY CALIBRATE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=quick_homed VALUE=1
    _STATUS_READY

[gcode_macro _FILAMENT_CHANGE_PREPARE]
description: Heat, home if needed, park, then continue with the operation
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set operation = state.operation|int %}
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% if state.active|int == 1 and state.stage|int in [1, 2] %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=2
        _FILAMENT_CHANGE_BUSY TITLE="Preparing printer" TEXT="Heating nozzle and moving toolhead to the front. Please wait."
        {% if operation == 3 or not homed %}
            M104 S{cfg.preheat_temp}
        {% else %}
            M104 S{cfg.unload_temp}
        {% endif %}
        {% if not homed %}
            _FILAMENT_CHANGE_HOME
        {% endif %}
        _FILAMENT_CHANGE_PARK
        M400
        {% if operation == 3 %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=6
            _FILAMENT_CHANGE_TOUCH
            _FILAMENT_CHANGE_SHOW_MATERIAL
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=3
            M104 S{cfg.unload_temp}
            _FILAMENT_CHANGE_BUSY TITLE="Heating for unload" TEXT="Heating nozzle to {cfg.unload_temp|int} C to unload filament. Please wait."
        {% endif %}
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_DO_UNLOAD]
description: Unload the old filament, then ask the user to remove it
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 and state.stage|int == 4 %}
        _FILAMENT_CHANGE_BUSY TITLE="Unloading filament" TEXT="Unloading old filament. Please wait and do not touch toolhead or the filament. The nozzle is hot."
        _FILAMENT_UNLOAD
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=5
        _FILAMENT_CHANGE_TOUCH
        _FILAMENT_CHANGE_SHOW_REMOVE
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_SHOW_REMOVE]
description: Ask the user to remove the old filament
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Remove old filament"
    RESPOND TYPE=command MSG="action:prompt_text The old filament has been pulled out of the hotend. Pull it out of the toolhead now. The nozzle is hot, do not touch it. Press the button when the filament is out."
    RESPOND TYPE=command MSG="action:prompt_button Filament removed|_FILAMENT_CHANGE_REMOVED|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FILAMENT_CHANGE_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_CHANGE_REMOVED]
description: Old filament removed
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 and state.stage|int == 5 %}
        {% if state.operation|int == 2 %}
            _FILAMENT_CHANGE_FINISH MESSAGE="Filament unloaded and removed. Nozzle is cooling down."
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=6
            _FILAMENT_CHANGE_TOUCH
            _FILAMENT_CHANGE_SHOW_MATERIAL
        {% endif %}
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_SHOW_MATERIAL]
description: Ask which filament is being loaded
gcode:
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    RESPOND TYPE=command MSG="action:prompt_begin Select new filament"
    RESPOND TYPE=command MSG="action:prompt_text Which filament do you want to load?"
    #RESPOND TYPE=command MSG="action:prompt_text PLA: {cfg.temp_pla|int} C"
    #RESPOND TYPE=command MSG="action:prompt_text PETG: {cfg.temp_petg|int} C"
    #RESPOND TYPE=command MSG="action:prompt_text ASA/ABS: {cfg.temp_asa|int} C"
    #RESPOND TYPE=command MSG="action:prompt_text Flex: {cfg.temp_flex|int} C"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_FILAMENT_CHANGE_SET_MATERIAL TYPE=PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG|_FILAMENT_CHANGE_SET_MATERIAL TYPE=PETG|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ASA / ABS|_FILAMENT_CHANGE_SET_MATERIAL TYPE=ASA|primary"
    RESPOND TYPE=command MSG="action:prompt_button Flex|_FILAMENT_CHANGE_SET_MATERIAL TYPE=FLEX|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FILAMENT_CHANGE_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_CHANGE_SET_MATERIAL]
description: Material selected (TYPE=PLA/PETG/ASA)
description: Material selected (TYPE=PLA/PETG/ASA/FLEX)
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set material = params.TYPE|default('')|upper %}
    {% set target = 0 %}
    {% set name = '' %}
    {% set speed = cfg.purge_speed|float %}
    {% if material == 'PLA' %}
        {% set target = cfg.temp_pla|int %}
        {% set name = 'PLA' %}
    {% elif material == 'PETG' %}
        {% set target = cfg.temp_petg|int %}
        {% set name = 'PETG' %}
    {% elif material in ['ASA', 'ABS'] %}
        {% set target = cfg.temp_asa|int %}
        {% set name = 'ASA / ABS' %}
    {% elif material == 'FLEX' %}
        {% set target = cfg.temp_flex|int %}
        {% set name = 'Flex' %}
        {% set speed = cfg.purge_speed_flex|float %}
    {% endif %}
    {% if state.active|int == 1 and state.stage|int == 6 and target > 0 %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=load_temp VALUE={target}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=purge_speed VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=inserted VALUE=0
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=7
        _FILAMENT_CHANGE_TOUCH
        M104 S{target}
        RESPOND TYPE=command MSG="action:prompt_begin Insert {name} filament"
        RESPOND TYPE=command MSG="action:prompt_text Push new filament into the top of the toolhead until you feel the gears grab it. Nozzle is heating to {target} C and is hot, do not touch it. Press the button when the filament is inserted."
        RESPOND TYPE=command MSG="action:prompt_button Filament inserted|_FILAMENT_CHANGE_INSERTED|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FILAMENT_CHANGE_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_INSERTED]
description: New filament inserted
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 and state.stage|int == 7 %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=inserted VALUE=1
        _FILAMENT_CHANGE_TOUCH
        _FILAMENT_CHANGE_BUSY TITLE="Waiting for nozzle temperature" TEXT="Filament inserted. Waiting until nozzle has reached {state.load_temp|int} C, then filament is loaded automatically."
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_DO_LOAD]
description: Load the new filament, then ask whether it extrudes cleanly
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 and state.stage|int == 8 %}
        _FILAMENT_CHANGE_BUSY TITLE="Loading filament" TEXT="Loading new filament. Please wait."
        _FILAMENT_LOAD
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=9
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=retries VALUE=0
        _FILAMENT_CHANGE_TOUCH
        _FILAMENT_CHANGE_ASK TRIES=0
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_ASK]
description: Ask whether the new filament extrudes cleanly (TRIES)
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set tries = params.TRIES|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Check new filament"
    RESPOND TYPE=command MSG="action:prompt_text Is new filament coming out of the nozzle cleanly? No will purge {cfg.load_purge|int} mm more."
    {% if tries >= 5 %}
        RESPOND TYPE=command MSG="action:prompt_text Still not working after {tries} tries? The filament may not be gripped by the gears. Press Cancel, then start again with Load only and push the filament in until you feel it grab."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes - finish|_FILAMENT_CHANGE_SUCCESS|primary"
    RESPOND TYPE=command MSG="action:prompt_button No - purge more|_FILAMENT_CHANGE_PURGE_MORE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FILAMENT_CHANGE_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_CHANGE_PURGE_MORE]
description: Purge more filament and ask again
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set tries = state.retries|int + 1 %}
    {% if state.active|int == 1 and state.stage|int == 9 %}
        _FILAMENT_CHANGE_BUSY TITLE="Purging" TEXT="Purging more filament. Please wait."
        _FILAMENT_PURGE
        SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=retries VALUE={tries}
        _FILAMENT_CHANGE_TOUCH
        _FILAMENT_CHANGE_ASK TRIES={tries}
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_SUCCESS]
description: Filament extrudes cleanly, finish
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 and state.stage|int == 9 %}
        _FILAMENT_CHANGE_FINISH MESSAGE="Filament change complete. The nozzle is cooling down. Please remove purged filament from the print bed."
    {% endif %}


# ---------------------------------------------------------------------
# Cancel and common finish handler
# ---------------------------------------------------------------------

[gcode_macro _FILAMENT_CHANGE_CANCEL]
description: Cancel the wizard
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% if state.active|int == 1 %}
        _FILAMENT_CHANGE_FINISH MESSAGE="Filament change cancelled. The previous nozzle target has been restored."
    {% else %}
        _FILAMENT_CHANGE_CLOSE
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_FINISH]
description: Stop the wizard, restore nozzle target and idle timeout (MESSAGE)
gcode:
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set restore = state.restore_temp|float %}
#    {% if state.quick_homed|int == 1 %}
#        M400
#        SET_KINEMATIC_POSITION CLEAR=Z
#       SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=quick_homed VALUE=0
#    {% endif %}
    UPDATE_DELAYED_GCODE ID=_FILAMENT_CHANGE_POLL DURATION=0
    M104 S{restore}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=restore_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=load_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=inserted VALUE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=retries VALUE=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=deadline VALUE=0.0
    {% if params.MESSAGE is defined %}
        RESPOND MSG="{params.MESSAGE}"
        _FILAMENT_CHANGE_NOTICE MESSAGE="{params.MESSAGE}"
    {% else %}
        _FILAMENT_CHANGE_CLOSE
    {% endif %}


# ---------------------------------------------------------------------
# Non-blocking state machine
#
# The delayed_gcode only calls _FILAMENT_CHANGE_TICK, so all decisions
# are made with fresh state at the moment the tick actually runs.
# Temperature windows are +/- tolerance. The watchdog catches the rare
# case of a window that is never reached.
# ---------------------------------------------------------------------

[delayed_gcode _FILAMENT_CHANGE_POLL]
gcode:
    _FILAMENT_CHANGE_TICK


[gcode_macro _FILAMENT_CHANGE_TICK]
description: One poll cycle of the wizard
gcode:
    {% set cfg = printer["gcode_macro _FILAMENT_CHANGE_CONFIG"] %}
    {% set state = printer["gcode_macro _FILAMENT_CHANGE_STATE"] %}
    {% set stage = state.stage|int %}
    {% set temp = printer.extruder.temperature|float %}
    {% set clock = printer.toolhead.estimated_print_time|float %}
    {% set tol = cfg.tolerance|float %}
    {% set delay = 1 %}
    {% if state.active|int == 1 %}
        {% if clock > state.deadline|float %}
            _FILAMENT_CHANGE_FINISH MESSAGE="Filament change aborted because nothing was pressed for a while. The previous nozzle target has been restored."
            {% set delay = 0 %}
        {% elif stage == 1 %}
            {% if temp <= cfg.home_max_temp|float %}
                _FILAMENT_CHANGE_PREPARE
            {% endif %}
        {% elif stage == 3 %}
            {% if temp >= cfg.unload_temp|float - tol %}
                SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=4
                {% set delay = cfg.soak_seconds|int %}
            {% endif %}
        {% elif stage == 4 %}
            _FILAMENT_CHANGE_DO_UNLOAD
        {% elif stage == 7 %}
            {% if state.inserted|int == 1 and (temp - state.load_temp|float)|abs <= tol %}
                SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE_STATE VARIABLE=stage VALUE=8
                {% set delay = cfg.soak_seconds|int %}
            {% endif %}
        {% elif stage == 8 %}
            _FILAMENT_CHANGE_DO_LOAD
        {% endif %}
        {% if delay > 0 %}
            UPDATE_DELAYED_GCODE ID=_FILAMENT_CHANGE_POLL DURATION={delay}
        {% endif %}
    {% endif %}