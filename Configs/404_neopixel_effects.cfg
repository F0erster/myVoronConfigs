#####################################################################
#  Toolhead status LEDs - Xol: LED 1 = logo, LED 2-3 = nozzle sequins (all RGBW)
#  Layer format: <type> <rate> <cutoff> <blend> (R, G, B, W)
#    blink:     rate = cycle time in s, cutoff = on-ratio (0-1)
#    breathing: rate = cycle time in s
#####################################################################

####################
## Logo (LED 1)   ##
####################

[led_effect status_logo_ready]
leds:
    neopixel:hotend_rgb (1)
autostart: true
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0, 0.15)

[led_effect status_logo_homing]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 1 0.5 top (0.0, 0.5, 0.5, 0.0)

[led_effect status_logo_calibrating_z]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 0.5 0.5 top (0.0, 0.0, 1.0, 0.0)

[led_effect status_logo_leveling]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 1 0.5 top (0.6, 0.0, 0.6, 0.0)

[led_effect status_logo_meshing]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 1 0.5 top (0.0, 0.8, 0.0, 0.0)

[led_effect status_logo_heating]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 1 0.5 top (1.0, 0.3, 0.0, 0.0)

[led_effect status_logo_cleaning]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    blink 1 0.5 top (0.0, 0.0, 0.0, 0.6)

[led_effect status_logo_printing]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.6, 0.0, 0.0)

[led_effect status_logo_part_ready]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    breathing 4 1 top (0.0, 0.8, 0.0, 0.0)

[led_effect status_logo_paused]
leds:
    neopixel:hotend_rgb (1)
autostart: false
frame_rate: 24
layers:
    breathing 4 1 top (0.8, 0.6, 0.0, 0.0)

########################
## Nozzle (LED 2-3)   ##
########################

[led_effect status_nozzle_off]
leds:
    neopixel:hotend_rgb (2,3)
autostart: true
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0, 0.0)

[led_effect status_nozzle_white]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 0.0, 1.0)

[led_effect status_nozzle_cyan]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.5, 0.5, 0.0)

[led_effect status_nozzle_blue]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.0, 1.0, 0.0)

[led_effect status_nozzle_magenta]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.6, 0.0, 0.6, 0.0)

[led_effect status_nozzle_green]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (0.0, 0.8, 0.0, 0.0)

[led_effect status_nozzle_orange]
leds:
    neopixel:hotend_rgb (2,3)
autostart: false
frame_rate: 24
layers:
    static 0 0 top (1.0, 0.3, 0.0, 0.0)

####################
## Manual only    ##
####################

[led_effect rainbow]
leds:
    neopixel:hotend_rgb
autostart: false
frame_rate: 24
layers:
    gradient 0.3 1 add (0.3, 0.0, 0.0),(0.0, 0.3, 0.0),(0.0, 0.0, 0.3)